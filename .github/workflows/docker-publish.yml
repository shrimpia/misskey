name: Publish Docker image

# empire ブランチのコミットに v* タグを付けて push したときに Docker Hub へ公開する
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # empire 以外のブランチに付けられたタグは公開しない
      - name: Ensure tag is on empire branch
        run: |
          git fetch origin empire
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/empire; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not reachable from the empire branch."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/misskey
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/shrimpia/misskey
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
